<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>weathea app</title>
</head>
<body>
    
    <div class="card">
        <div class="search">
            <input type="text" id="input" placeholder="enter the city name" spellcheck="false">
            <button id="btn"><img src="weather-app-img/images/search.png" alt="xxx"></button>
        </div>
        <div class="weather">
            <img id="yash" src="/weather-app-img/images/mist.png" alt="yash">
            <h1 class="temp">22°C</h1>
            <h2 class="city">new york</h2>
            <div class="details">
                <div class="col">
                    <img src="weather-app-img/images/humidity.png"  alt="xxx"></img>
                    <div>
                        <p class="humidity">50%</p>
                        <p>humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="weather-app-img/images/wind.png" alt="xxx" ></img>
                    <div>
                        <p class="wind">15km/h</p>
                        <p>wind</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

   <script src="/app.js"></script>
</body>
</html>
